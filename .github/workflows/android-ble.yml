name: Android BLE validation

on:
  push:
    branches:
      - feature/ble-pixel-origin-isolation
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ble.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build and test Android app
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-ble-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
